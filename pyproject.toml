[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhisaotong-rag"
version = "0.2.0"
description = "扫地机器人知识库问答：向量 + BM25 混合检索的 RAG 示例"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "chromadb==1.4.1",
    "langchain-chroma>=0.1.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "pypdf>=4.0.0",
    "streamlit>=1.28.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
zhisaotong_agent = [
    "config/*.yml",
    "prompts/*.txt",
    "data/**/*",
]
